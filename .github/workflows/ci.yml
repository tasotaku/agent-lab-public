name: Cross-platform install

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.9"
            executable: python
          - os: windows-latest
            python: "3.13"
            executable: python
          - os: macos-latest
            python: "3.9"
            executable: python3
          - os: macos-latest
            python: "3.13"
            executable: python3
          - os: ubuntu-latest
            python: "3.9"
            executable: python3
          - os: ubuntu-latest
            python: "3.13"
            executable: python3
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install into isolated home
        run: ${{ matrix.executable }} bootstrap.py --home "${{ runner.temp }}/agent-lab-home" install
      - name: Check isolated installation
        run: ${{ matrix.executable }} bootstrap.py --home "${{ runner.temp }}/agent-lab-home" check
      - name: Load installed capability
        run: ${{ matrix.executable }} bootstrap.py --home "${{ runner.temp }}/agent-lab-home" smoke
      - name: Audit public payload and history
        run: ${{ matrix.executable }} tools/audit_public.py
      - name: Run unit and distribution tests
        run: ${{ matrix.executable }} tests/validate_distribution.py
