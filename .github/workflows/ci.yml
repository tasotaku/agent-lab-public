name: Cross-platform install

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install into isolated home
        run: python bootstrap.py --home "${{ runner.temp }}/agent-lab-home" install
      - name: Check isolated installation
        run: python bootstrap.py --home "${{ runner.temp }}/agent-lab-home" check
      - name: Load installed capability
        run: python bootstrap.py --home "${{ runner.temp }}/agent-lab-home" smoke
      - name: Audit public payload and history
        run: python tools/audit_public.py
      - name: Run unit and distribution tests
        run: python tests/validate_distribution.py
